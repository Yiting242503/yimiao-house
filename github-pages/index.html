<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f2eb" />
    <meta name="description" content="意淼小屋，把想念放进同一个家。为彼此留一盏灯。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>意淼小屋 · 把想念放进同一个家</title>
  </head>
  <body>
    <main class="welcome" aria-labelledby="house-title">
      <div class="room">
        <img
          src="./assets/room.webp"
          alt="暖灯下，两个人依偎在沙发上，窗边的阳光照进小屋。"
          width="1536"
          height="1024"
          fetchpriority="high"
        />
      </div>
      <section class="invitation" aria-label="欢迎回到小屋">
        <span class="house-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="m7 22 17-14 17 14v19H7V22Z" />
            <path d="M24 33c-7-4-10-8-6-11 2-2 5-1 6 1 1-2 4-3 6-1 4 3 1 7-6 11Z" />
          </svg>
        </span>
        <h1 id="house-title">意淼小屋</h1>
        <p class="tagline">把想念放进同一个家</p>
        <span class="little-line" aria-hidden="true"></span>
        <p class="lamp">为彼此留一盏灯</p>
        <a class="enter" href="https://yimiao-little-home.cool-otter-0098.chatgpt.site">
          <span>进入小屋</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </a>
        <p class="private-note">这里珍藏着两个人的私人回忆<br />进入后，请登录你的小屋账号</p>
      </section>
    </main>
  </body>
</html>
